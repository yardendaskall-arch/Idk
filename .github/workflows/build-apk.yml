name: Build Face Emoji APK

on:
  push:
    branches: [ "claude/face-emoji-converter-XxHWE", "main" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Gradle Wrapper
        working-directory: FaceEmojiApp
        run: gradle wrapper --gradle-version=8.5

      - name: Make gradlew executable
        working-directory: FaceEmojiApp
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: FaceEmojiApp
        run: ./gradlew assembleDebug --no-daemon -PBUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK
        run: |
          mv FaceEmojiApp/app/build/outputs/apk/debug/app-debug.apk \
             FaceEmojiApp/app/build/outputs/apk/debug/face-emoji.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-emoji-debug
          path: FaceEmojiApp/app/build/outputs/apk/debug/face-emoji.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Face Emoji Build ${{ github.run_number }}"
          body: |
            Automated build #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: FaceEmojiApp/app/build/outputs/apk/debug/face-emoji.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
