name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-tv-remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk-releases branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/universal-tv-remote-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-releases
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/universal-tv-remote-debug.apk universal-tv-remote-debug.apk
          git add universal-tv-remote-debug.apk
          git commit -m "Build APK from ${GITHUB_SHA}"
          git push --force origin HEAD:apk-releases
