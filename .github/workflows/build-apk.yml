name: Build APK

on:
  push:
    branches: [ "claude/vpn-app-development-QVkcn", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show Gradle/Java environment
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-debug.log; exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-debug.log
          retention-days: 7

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace 2>&1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalVPN-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
