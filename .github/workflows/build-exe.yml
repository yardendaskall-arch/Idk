name: Build Windows EXE

on:
  push:
    branches: [ claude/vpn-app-development-QVkcn, main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/GlobalVPN/GlobalVPN.csproj

      - name: Publish self-contained EXE
        run: >
          dotnet publish windows/GlobalVPN/GlobalVPN.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GlobalVPN-Windows
          path: windows/GlobalVPN/bin/Release/net8.0-windows/win-x64/publish/GlobalVPN.exe
          retention-days: 30
