<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: 'Courier New', monospace;
      color: #eee;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      margin-bottom: 8px;
      color: #4ecca3;
      text-shadow: 0 0 10px #4ecca3;
    }
    #scoreboard {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: clamp(0.85rem, 3.5vw, 1.1rem);
    }
    #score-val, #high-val { color: #4ecca3; font-weight: bold; }
    #canvas {
      border: 3px solid #4ecca3;
      box-shadow: 0 0 20px #4ecca355;
      background: #0f0f1a;
      touch-action: none;
    }
    #message {
      margin-top: 12px;
      font-size: clamp(0.75rem, 3vw, 1rem);
      color: #aaa;
      min-height: 1.4em;
      text-align: center;
      padding: 0 12px;
    }
    #message span { color: #4ecca3; }

    /* D-pad controls */
    #dpad {
      display: none;
      margin-top: 20px;
      position: relative;
      width: 150px;
      height: 150px;
      flex-shrink: 0;
    }
    .dpad-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      background: #2a2a4a;
      border: 2px solid #4ecca3;
      border-radius: 8px;
      color: #4ecca3;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      active-color: #4ecca3;
      transition: background 0.1s;
    }
    .dpad-btn:active { background: #3a3a6a; }
    #btn-up    { top: 0;    left: 51px; }
    #btn-down  { bottom: 0; left: 51px; }
    #btn-left  { top: 51px; left: 0;   }
    #btn-right { top: 51px; right: 0;  }
    #btn-center {
      position: absolute;
      top: 51px; left: 51px;
      width: 48px; height: 48px;
      background: #1e1e35;
      border: 2px solid #333;
      border-radius: 8px;
    }

    /* Start/pause button for mobile */
    #btn-start {
      display: none;
      margin-top: 14px;
      padding: 10px 32px;
      background: #4ecca3;
      color: #0f0f1a;
      border: none;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #dpad { display: flex; }
    #btn-start { display: block; }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="scoreboard">
    <div>SCORE: <span id="score-val">0</span></div>
    <div>BEST: <span id="high-val">0</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="message">Press <span>START</span> to play</div>

  <div id="dpad">
    <div class="dpad-btn" id="btn-up">▲</div>
    <div class="dpad-btn" id="btn-left">◀</div>
    <div class="dpad-btn" id="btn-right">▶</div>
    <div class="dpad-btn" id="btn-down">▼</div>
    <div id="btn-center"></div>
  </div>
  <button id="btn-start">START</button>

  <!-- Connection status badge -->
  <style>
    #vc-status {
      position: fixed;
      bottom: 12px;
      right: 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      color: #888;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      z-index: 999;
    }
    #vc-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background 0.4s;
    }
    #vc-dot.ok  { background: #4ecca3; box-shadow: 0 0 6px #4ecca3; }
    #vc-dot.err { background: #ff6b6b; }
  </style>
  <div id="vc-status"><div id="vc-dot"></div><span id="vc-label">vercel</span></div>

  <script>
    // ─── Vercel global-code sync ─────────────────────────────────────────────
    // Polls /api/code every second. Any change is applied to every connected client.
    // Console API (open DevTools → Console):
    //
    //   setCode(`document.querySelector('h1').textContent = 'OWNED'`)
    //   setCss(`body { background: hotpink !important; }`)
    //   clearCode()
    //   clearCss()
    //   setSpeed(60)   // snake tick ms (lower = faster)

    const _dot   = document.getElementById('vc-dot');
    const _label = document.getElementById('vc-label');
    let _styleEl = null, _lastJs = null, _lastCss = null;

    async function _poll() {
      try {
        const r = await fetch('/api/code');
        if (!r.ok) throw new Error(r.status);
        const { js, css } = await r.json();

        if (js !== _lastJs) {
          _lastJs = js;
          if (js) { try { (new Function(js))(); } catch (e) { console.error('[setCode error]', e); } }
        }
        if (css !== _lastCss) {
          _lastCss = css;
          if (!_styleEl) { _styleEl = document.createElement('style'); document.head.appendChild(_styleEl); }
          _styleEl.textContent = css || '';
        }

        _dot.className = 'ok';
        _label.textContent = 'vercel ●';
      } catch {
        _dot.className = 'err';
        _label.textContent = 'vercel ○';
      }
    }

    async function _push(type, code) {
      await fetch('/api/code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, code: code ?? '' })
      });
    }

    window.setCode   = js  => _push('js',  js ).then(() => console.log('%c✓ Code pushed to all clients', 'color:#4ecca3'));
    window.setCss    = css => _push('css', css).then(() => console.log('%c✓ CSS pushed to all clients',  'color:#4ecca3'));
    window.clearCode = ()  => _push('js',  ''  ).then(() => console.log('%c✓ Code cleared', 'color:#aaa'));
    window.clearCss  = ()  => _push('css', ''  ).then(() => console.log('%c✓ CSS cleared',  'color:#aaa'));

    window.setSpeed = ms => {
      speed = ms;
      if (state === 'running') { clearInterval(interval); interval = setInterval(tick, speed); }
      console.log('%cSpeed → ' + ms + 'ms', 'color:#4ecca3');
    };

    _poll();
    setInterval(_poll, 1000);

    console.log(
      '%c[Vercel Global Code]\n%c' +
      ' setCode(js)   → push JS to all clients\n' +
      ' setCss(css)   → push CSS to all clients\n' +
      ' clearCode()   → remove pushed JS\n' +
      ' clearCss()    → remove pushed CSS\n' +
      ' setSpeed(ms)  → change snake speed\n',
      'color:#4ecca3;font-weight:bold', 'color:#aaa'
    );
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const CELL = 20;
    let snake, dir, nextDir, food, score, highScore, state, interval, speed, countdownTimer;

    function COLS() { return canvas.width / CELL; }
    function ROWS() { return canvas.height / CELL; }

    function resize() {
      const maxW = Math.min(window.innerWidth - 16, window.innerHeight * 0.55, 400);
      const size = Math.floor(maxW / CELL) * CELL;
      canvas.width = size;
      canvas.height = size;
      if (food) draw();
    }
    resize();
    window.addEventListener('resize', resize);

    function init() {
      const cx = Math.floor(COLS() / 2);
      const cy = Math.floor(ROWS() / 2);
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 120;
      state = 'idle';
      highScore = highScore || 0;
      placeFood();
      updateScore();
      draw();
      clearInterval(countdownTimer);
      let t = 5;
      setMessage('Starting in <span>' + t + '</span>...');
      countdownTimer = setInterval(() => {
        t--;
        if (t > 0) {
          setMessage('Starting in <span>' + t + '</span>...');
        } else {
          clearInterval(countdownTimer);
          if (state === 'idle') start();
        }
      }, 1000);
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS()), y: Math.floor(Math.random() * ROWS()) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function start() {
      if (state === 'running') return;
      clearInterval(countdownTimer);
      if (state === 'dead') init();
      state = 'running';
      clearInterval(interval);
      interval = setInterval(tick, speed);
      setMessage('');
      document.getElementById('btn-start').textContent = 'PAUSE';
    }

    function pause() {
      if (state === 'running') {
        clearInterval(interval);
        state = 'paused';
        setMessage('PAUSED');
        document.getElementById('btn-start').textContent = 'RESUME';
      } else if (state === 'paused') {
        state = 'running';
        interval = setInterval(tick, speed);
        setMessage('');
        document.getElementById('btn-start').textContent = 'PAUSE';
      }
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS() || head.y < 0 || head.y >= ROWS()) return die();
      if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        if (score > highScore) highScore = score;
        updateScore();
        placeFood();
        if (score % 5 === 0 && speed > 50) {
          speed = Math.max(50, speed - 10);
          clearInterval(interval);
          interval = setInterval(tick, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function die() {
      clearInterval(interval);
      state = 'dead';
      drawDead();
      const isMobile = window.matchMedia('(pointer: coarse)').matches;
      setMessage('Game Over! Score: <span>' + score + '</span>');
      document.getElementById('btn-start').textContent = 'RESTART';
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, w, h);

      for (let x = 0; x < COLS(); x++) {
        for (let y = 0; y < ROWS(); y++) {
          ctx.fillStyle = '#1e1e35';
          ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        }
      }

      // Food
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.save();
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ff6b6b';
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Snake
      snake.forEach((seg, i) => {
        const alpha = 1 - (i / snake.length) * 0.5;
        ctx.save();
        ctx.shadowBlur = i === 0 ? 12 : 0;
        ctx.shadowColor = '#4ecca3';
        ctx.fillStyle = i === 0 ? '#4ecca3' : `rgba(78,204,163,${alpha})`;
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        const rx = seg.x * CELL + pad, ry = seg.y * CELL + pad, rw = CELL - pad * 2, rh = CELL - pad * 2, rr = 4;
        if (ctx.roundRect) {
          ctx.roundRect(rx, ry, rw, rh, rr);
        } else {
          ctx.rect(rx, ry, rw, rh);
        }
        ctx.fill();
        ctx.restore();
      });

      // Eyes
      const h2 = snake[0];
      ctx.fillStyle = '#0f0f1a';
      const ex = dir.x, ey = dir.y;
      const cx2 = h2.x * CELL + CELL / 2;
      const cy2 = h2.y * CELL + CELL / 2;
      const perp = { x: -ey, y: ex };
      [[1], [-1]].forEach(([s]) => {
        ctx.beginPath();
        ctx.arc(cx2 + ex * 4 + perp.x * s * 3, cy2 + ey * 4 + perp.y * s * 3, 2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawDead() {
      draw();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function updateScore() {
      document.getElementById('score-val').textContent = score;
      document.getElementById('high-val').textContent = highScore;
    }

    function setMessage(html) {
      document.getElementById('message').innerHTML = html;
    }

    // Keyboard controls
    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':    case 'w': case 'W':
          if (dir.y !== 1)  nextDir = { x: 0, y: -1 }; break;
        case 'ArrowDown':  case 's': case 'S':
          if (dir.y !== -1) nextDir = { x: 0, y: 1 };  break;
        case 'ArrowLeft':  case 'a': case 'A':
          if (dir.x !== 1)  nextDir = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D':
          if (dir.x !== -1) nextDir = { x: 1, y: 0 };  break;
        case ' ': case 'Enter':
          e.preventDefault();
          if (state === 'idle' || state === 'dead') start();
          else pause();
          break;
        case 'p': case 'P':
          if (state === 'running' || state === 'paused') pause();
          break;
      }
    });

    // D-pad buttons
    function dpadPress(dx, dy) {
      if (state === 'idle' || state === 'dead') { start(); return; }
      if (dx === 1  && dir.x !== -1) nextDir = { x: 1,  y: 0 };
      if (dx === -1 && dir.x !== 1)  nextDir = { x: -1, y: 0 };
      if (dy === 1  && dir.y !== -1) nextDir = { x: 0,  y: 1 };
      if (dy === -1 && dir.y !== 1)  nextDir = { x: 0,  y: -1 };
    }
    document.getElementById('btn-up').addEventListener('touchstart',    e => { e.preventDefault(); dpadPress(0, -1); }, { passive: false });
    document.getElementById('btn-down').addEventListener('touchstart',  e => { e.preventDefault(); dpadPress(0,  1); }, { passive: false });
    document.getElementById('btn-left').addEventListener('touchstart',  e => { e.preventDefault(); dpadPress(-1, 0); }, { passive: false });
    document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); dpadPress( 1, 0); }, { passive: false });

    // Start/pause button
    document.getElementById('btn-start').addEventListener('click', () => {
      if (state === 'idle' || state === 'dead') start();
      else pause();
    });

    // Swipe detection on canvas
    let touchStartX, touchStartY;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });
    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      if (touchStartX === undefined) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        // Tap on canvas = start/pause
        if (state === 'idle' || state === 'dead') start();
        else pause();
        return;
      }
      if (Math.abs(dx) > Math.abs(dy)) {
        dpadPress(dx > 0 ? 1 : -1, 0);
      } else {
        dpadPress(0, dy > 0 ? 1 : -1);
      }
    }, { passive: false });

    init();
  </script>
</body>
</html>
