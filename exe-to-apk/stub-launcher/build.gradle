plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exewrapper.payload'
    compileSdk 34

    defaultConfig {
        applicationId "com.exewrapper.payload"
        minSdk 24
        // targetSdk 28 keeps V1-only JAR signing valid on all Android versions,
        // avoiding the need to implement APK v2/v3 signing block.
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
