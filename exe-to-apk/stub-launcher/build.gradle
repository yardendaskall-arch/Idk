plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exewrapper.payload'
    compileSdk 34

    defaultConfig {
        applicationId "com.exewrapper.payload"
        minSdk 24
        targetSdk 28   // V1-only JAR signing valid on all Android versions
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Allow the large Wine runtime download over HTTP (some mirrors use HTTP)
    android.packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // TAR + XZ + Zstandard extraction (Winlator packages rootfs as .tzst = tar+zstd)
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'org.tukaani:xz:1.9'
    // @aar uses the Android Archive which packages libzstd-jni.so at lib/arm64-v8a/
    // (the plain .jar uses linux/aarch64/ paths that Android's linker ignores)
    implementation 'com.github.luben:zstd-jni:1.5.6-3@aar'
}
