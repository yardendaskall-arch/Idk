plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Build number injected by CI via -PBUILD_NUMBER=N; defaults to 1 locally
def buildNum = project.hasProperty('BUILD_NUMBER') ? project.BUILD_NUMBER.toInteger() : 1

android {
    namespace 'com.facemoji.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.facemoji.app"
        minSdk 21
        targetSdk 34
        versionCode buildNum
        versionName "1.${buildNum}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Exposed to BuildConfig so the update checker can compare versions
        buildConfigField "int",    "BUILD_NUMBER",  "${buildNum}"
        buildConfigField "String", "GITHUB_REPO",   '"yardendaskall-arch/Idk"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX
    def camerax_version = "1.3.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Face Detection
    implementation 'com.google.mlkit:face-detection:16.1.5'

    // Coroutines for async (update check, download)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
